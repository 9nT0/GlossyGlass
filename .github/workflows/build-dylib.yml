		B10000000000000000000004 /* GlassNavigationHelper.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = GlassNavigationHelper.swift; sourceTree = "<group>"; };
		B10000000000000000000005 /* GlassSwiftUI.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = GlassSwiftUI.swift; sourceTree = "<group>"; };
		B10000000000000000000006 /* GlassPreferences.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = GlassPreferences.swift; sourceTree = "<group>"; };
		B10000000000000000000007 /* GlassSettingsButton.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = GlassSettingsButton.swift; sourceTree = "<group>"; };
