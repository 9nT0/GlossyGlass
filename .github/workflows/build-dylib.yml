name: Build iOS dylib
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build iOS dylib
        shell: bash
        run: |
          set -euo pipefail
          echo "Xcode = $(xcodebuild -version | head -1)"
          mkdir -p GlossyGlass.xcodeproj
          cat > GlossyGlass.xcodeproj/project.pbxproj << 'ENDPROJECT'
