name: Build iOS dylib

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build real iOS arm64 dylib
        run: |
          set -euo pipefail

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          TARGET="arm64-apple-ios17.0"

          echo "SDK    = $SDK"
          echo "Target = $TARGET"
          echo "Xcode  = $(xcodebuild -version | head -1)"

          mkdir -p output build

          # Only Swift sources
          mapfile -t SOURCES < <(find . -name "*.swift" \
            -not -name "Package.swift" \
            -not -path "./.build/*" \
            -not -path "./output/*" \
            -not -path "./build/*")

          echo "Sources (${#SOURCES[@]}):"
          printf '  %s\n' "${SOURCES[@]}"

          # Compile all sources together into one object file
          echo "Compiling..."
          xcrun --sdk iphoneos swiftc \
            -c \
            -target "$TARGET" \
            -sdk "$SDK" \
            -O \
            -whole-module-optimization \
            -parse-as-library \
            -module-name GlossyGlass \
            -o build/GlossyGlass.o \
            "${SOURCES[@]}"

          echo "Linking with forced iOS platform..."
          xcrun --sdk iphoneos clang++ \
            -target "$TARGET" \
            -isysroot "$SDK" \
            -dynamiclib \
            -o output/GlossyGlass.dylib \
            -install_name "@rpath/GlossyGlass.dylib" \
            -Xlinker -platform_version -Xlinker ios -Xlinker 17.0 -Xlinker 17.5 \
            -Xlinker -ios_version_min -Xlinker 17.0 \
            -framework Foundation \
            -framework UIKit \
            -framework SwiftUI \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework CoreImage \
            build/GlossyGlass.o

          echo ""
          echo "=== file ==="
          file output/GlossyGlass.dylib

          echo ""
          echo "=== LC_BUILD_VERSION ==="
          otool -l output/GlossyGlass.dylib | grep -A8 LC_BUILD_VERSION || true

          if otool -l output/GlossyGlass.dylib | grep -q "platform 2"; then
            echo "ERROR: Still macOS (platform 2)"
            exit 1
          fi

          if otool -l output/GlossyGlass.dylib | grep -q "platform 1"; then
            echo "✅ SUCCESS: Real iOS binary (platform 1)"
          else
            echo "No platform 2 detected"
            otool -l output/GlossyGlass.dylib | grep -A10 LC_BUILD_VERSION || true
          fi

          ls -la output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GlossyGlass-dylib
          path: output/GlossyGlass.dylib
          retention-days: 30
