name: Build iOS dylib
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS dylib
        shell: bash
        run: |
          set -euo pipefail
          echo "Xcode = $(xcodebuild -version | head -1)"

          # Discover sources dynamically — exclude Package.swift / SPM / docs
          SWIFT_FILES=($(ls -1 *.swift 2>/dev/null | grep -v -E '^(Package)\.swift$' | sort || true))
          OBJC_FILES=($(ls -1 *.m 2>/dev/null | sort || true))
          C_FILES=($(ls -1 *.c 2>/dev/null | sort || true))

          echo "Swift: ${#SWIFT_FILES[@]}  ObjC: ${#OBJC_FILES[@]}  C: ${#C_FILES[@]}"
          if [ ${#SWIFT_FILES[@]} -eq 0 ]; then
            echo "ERROR: no .swift sources found"
            exit 1
          fi

          # Build a minimal Xcode project via Ruby (avoids YAML heredoc breakage)
          ruby << 'RUBY'
          require 'fileutils'
          FileUtils.mkdir_p('GlossyGlass.xcodeproj')

          exclude = %w[Package.swift]
          swift = Dir['*.swift'].sort.reject { |f| exclude.include?(f) }
          objc  = Dir['*.m'].sort
          c     = Dir['*.c'].sort
          all   = swift + objc + c

          # PBX IDs
          ids = {}
          all.each_with_index { |f, i| ids[f] = format('A%03d', i+1) }
          file_ids = {}
          all.each_with_index { |f, i| file_ids[f] = format('B%03d', i+1) }

          build_files = all.map { |f|
            type = f.end_with?('.swift') ? 'sourcecode.swift' :
                   f.end_with?('.m')     ? 'sourcecode.c.objc' : 'sourcecode.c.c'
            %(#{ids[f]} /* #{f} in Sources */ = {isa = PBXBuildFile; fileRef = #{file_ids[f]}; };)
          }.join("\n")

          file_refs = all.map { |f|
            type = f.end_with?('.swift') ? 'sourcecode.swift' :
                   f.end_with?('.m')     ? 'sourcecode.c.objc' : 'sourcecode.c.c'
            %(#{file_ids[f]} /* #{f} */ = {isa = PBXFileReference; lastKnownFileType = #{type}; path = #{f}; sourceTree = "<group>"; };)
          }.join("\n")

          sources_list = all.map { |f| "#{ids[f]} /* #{f} in Sources */," }.join("\n")
          group_list   = all.map { |f| "#{file_ids[f]} /* #{f} */," }.join("\n")

          pbx = <<~PBX
          // !$*UTF8*$!
          {
            archiveVersion = 1;
            classes = {};
            objectVersion = 56;
            objects = {
          #{build_files}
          #{file_refs}
              GRP /* Sources */ = {
                isa = PBXGroup;
                children = (
          #{group_list}
                );
                sourceTree = "<group>";
              };
              ROOT /* Root */ = {
                isa = PBXGroup;
                children = ( GRP, );
                sourceTree = "<group>";
              };
              TGT /* GlossyGlass */ = {
                isa = PBXNativeTarget;
                buildConfigurationList = CLT;
                buildPhases = ( SRC, );
                buildRules = ();
                dependencies = ();
                name = GlossyGlass;
                productName = GlossyGlass;
                productReference = PROD;
                productType = "com.apple.product-type.library.dynamic";
              };
              SRC /* Sources */ = {
                isa = PBXSourcesBuildPhase;
                buildActionMask = 2147483647;
                files = (
          #{sources_list}
                );
                runOnlyForDeploymentPostprocessing = 0;
              };
              PROD /* GlossyGlass.dylib */ = {
                isa = PBXFileReference;
                explicitFileType = "compiled.mach-o.dylib";
                includeInIndex = 0;
                path = GlossyGlass.dylib;
                sourceTree = BUILT_PRODUCTS_DIR;
              };
              PRJ /* Project */ = {
                isa = PBXProject;
                attributes = { LastSwiftUpdateCheck = 1500; LastUpgradeCheck = 1500; };
                buildConfigurationList = CLP;
                compatibilityVersion = "Xcode 14.0";
                developmentRegion = en;
                hasScannedForEncodings = 0;
                knownRegions = ( en, Base, );
                mainGroup = ROOT;
                productRefGroup = ROOT;
                projectDirPath = "";
                projectRoot = "";
                targets = ( TGT, );
              };
              DBG /* Debug */ = {
                isa = XCBuildConfiguration;
                buildSettings = {
                  ALWAYS_SEARCH_USER_PATHS = NO;
                  CLANG_ENABLE_MODULES = YES;
                  CLANG_ENABLE_OBJC_ARC = YES;
                  COPY_PHASE_STRIP = NO;
                  DEBUG_INFORMATION_FORMAT = dwarf;
                  ENABLE_TESTABILITY = YES;
                  GCC_DYNAMIC_NO_PIC = NO;
                  IPHONEOS_DEPLOYMENT_TARGET = 16.0;
                  ONLY_ACTIVE_ARCH = YES;
                  SDKROOT = iphoneos;
                  SWIFT_ACTIVE_COMPILATION_CONDITIONS = DEBUG;
                  SWIFT_OPTIMIZATION_LEVEL = "-Onone";
                };
                name = Debug;
              };
              REL /* Release */ = {
                isa = XCBuildConfiguration;
                buildSettings = {
                  ALWAYS_SEARCH_USER_PATHS = NO;
                  CLANG_ENABLE_MODULES = YES;
                  CLANG_ENABLE_OBJC_ARC = YES;
                  COPY_PHASE_STRIP = NO;
                  DEBUG_INFORMATION_FORMAT = "dwarf-with-dsym";
                  IPHONEOS_DEPLOYMENT_TARGET = 16.0;
                  SDKROOT = iphoneos;
                  SWIFT_COMPILATION_MODE = wholemodule;
                  SWIFT_OPTIMIZATION_LEVEL = "-O";
                  VALIDATE_PRODUCT = YES;
                };
                name = Release;
              };
              TD /* Target Debug */ = {
                isa = XCBuildConfiguration;
                buildSettings = {
                  CODE_SIGNING_ALLOWED = NO;
                  CODE_SIGN_IDENTITY = "";
                  DYLIB_COMPATIBILITY_VERSION = 1;
                  DYLIB_CURRENT_VERSION = 1;
                  DYLIB_INSTALL_NAME_BASE = "@rpath";
                  EXECUTABLE_PREFIX = "";
                  GENERATE_INFOPLIST_FILE = YES;
                  INSTALL_PATH = "@rpath";
                  OTHER_LDFLAGS = (
                    "-framework", UIKit,
                    "-framework", Foundation,
                    "-framework", SwiftUI,
                    "-framework", QuartzCore,
                    "-framework", AVFoundation,
                  );
                  PRODUCT_BUNDLE_IDENTIFIER = com.glossyglass.tweak;
                  PRODUCT_NAME = GlossyGlass;
                  SKIP_INSTALL = YES;
                  SWIFT_VERSION = 5.0;
                  TARGETED_DEVICE_FAMILY = "1,2";
                };
                name = Debug;
              };
              TR /* Target Release */ = {
                isa = XCBuildConfiguration;
                buildSettings = {
                  CODE_SIGNING_ALLOWED = NO;
                  CODE_SIGN_IDENTITY = "";
                  DYLIB_COMPATIBILITY_VERSION = 1;
                  DYLIB_CURRENT_VERSION = 1;
                  DYLIB_INSTALL_NAME_BASE = "@rpath";
                  EXECUTABLE_PREFIX = "";
                  GENERATE_INFOPLIST_FILE = YES;
                  INSTALL_PATH = "@rpath";
                  OTHER_LDFLAGS = (
                    "-framework", UIKit,
                    "-framework", Foundation,
                    "-framework", SwiftUI,
                    "-framework", QuartzCore,
                    "-framework", AVFoundation,
                  );
                  PRODUCT_BUNDLE_IDENTIFIER = com.glossyglass.tweak;
                  PRODUCT_NAME = GlossyGlass;
                  SKIP_INSTALL = YES;
                  SWIFT_VERSION = 5.0;
                  TARGETED_DEVICE_FAMILY = "1,2";
                };
                name = Release;
              };
              CLP /* Project configs */ = {
                isa = XCConfigurationList;
                buildConfigurations = ( DBG, REL, );
                defaultConfigurationIsVisible = 0;
                defaultConfigurationName = Release;
              };
              CLT /* Target configs */ = {
                isa = XCConfigurationList;
                buildConfigurations = ( TD, TR, );
                defaultConfigurationIsVisible = 0;
                defaultConfigurationName = Release;
              };
            };
            rootObject = PRJ;
          }
          PBX
          File.write('GlossyGlass.xcodeproj/project.pbxproj', pbx)
          puts "Generated project with #{all.size} sources"
          RUBY

          xcodebuild \
            -project GlossyGlass.xcodeproj \
            -target GlossyGlass \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            build

          DYLIB=$(find build -name 'GlossyGlass.dylib' 2>/dev/null | head -1)
          if [ -z "$DYLIB" ]; then
            echo "ERROR: GlossyGlass.dylib not found"
            find build -type f 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "Built: $DYLIB"
          ls -lh "$DYLIB"
          cp "$DYLIB" GlossyGlass.dylib
          file GlossyGlass.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: GlossyGlass-dylib
          path: GlossyGlass.dylib
