name: Build iOS dylib

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for iOS (arm64)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK_PATH"

          swift build -c release \
            --arch arm64 \
            -Xswiftc "-sdk" -Xswiftc "$SDK_PATH" \
            -Xswiftc "-target" -Xswiftc "arm64-apple-ios17.0"

      - name: Find and package the dylib
        run: |
          mkdir -p output
          BINARY=$(find .build -type f \( -name "libGlossyGlass.dylib" -o -name "GlossyGlass" \) | head -1)
          
          if [ -z "$BINARY" ]; then
            echo "ERROR: No binary found"
            find .build -type f | head -30
            exit 1
          fi

          echo "Found: $BINARY"
          cp "$BINARY" output/GlossyGlass.dylib
          file output/GlossyGlass.dylib
          ls -la output/

      - name: Upload the dylib
        uses: actions/upload-artifact@v4
        with:
          name: GlossyGlass-dylib
          path: output/GlossyGlass.dylib
          retention-days: 30
