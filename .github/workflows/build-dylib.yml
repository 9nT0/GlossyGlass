name: Build iOS dylib

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Create minimal Xcode project and build iOS dylib
        shell: bash
        run: |
          set -euo pipefail

          echo "Xcode = $(xcodebuild -version | head -1)"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK  = $SDK"

          # -------------------------------------------------------
          # 1. Create a minimal Xcode project that builds a dylib
          # -------------------------------------------------------
          mkdir -p GlossyGlass.xcodeproj

          cat > GlossyGlass.xcodeproj/project.pbxproj << 'PBX'
