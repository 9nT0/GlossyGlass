name: Build iOS dylib

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build real iOS arm64 dylib
        shell: bash
        run: |
          set -euo pipefail

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          TARGET="arm64-apple-ios17.0"
          SWIFT=$(xcrun --sdk iphoneos -f swiftc)

          echo "SDK    = $SDK"
          echo "Target = $TARGET"
          echo "swiftc = $SWIFT"
          echo "Xcode  = $(xcodebuild -version | head -1)"

          mkdir -p output build

          # Portable way to collect sources (no mapfile)
          SOURCES=""
          for f in $(find . -name "*.swift" \
              -not -name "Package.swift" \
              -not -path "./.build/*" \
              -not -path "./output/*" \
              -not -path "./build/*"); do
            SOURCES="$SOURCES $f"
          done

          echo "Sources:"
          for s in $SOURCES; do echo "  $s"; done

          # Critical: force SDKROOT so the driver does not fall back to macOS
          export SDKROOT="$SDK"

          echo "Compiling + linking..."
          # Use the real swiftc from the iPhoneOS SDK path
          "$SWIFT" \
            -emit-library \
            -o output/GlossyGlass.dylib \
            -module-name GlossyGlass \
            -target "$TARGET" \
            -sdk "$SDK" \
            -O \
            -whole-module-optimization \
            -parse-as-library \
            -Xlinker -platform_version -Xlinker ios -Xlinker 17.0 -Xlinker 17.5 \
            -Xlinker -ios_version_min -Xlinker 17.0 \
            $SOURCES

          echo ""
          echo "=== file ==="
          file output/GlossyGlass.dylib

          echo ""
          echo "=== LC_BUILD_VERSION ==="
          otool -l output/GlossyGlass.dylib | grep -A8 LC_BUILD_VERSION || true

          if otool -l output/GlossyGlass.dylib | grep -q "platform 2"; then
            echo "ERROR: Still macOS (platform 2)"
            exit 1
          fi

          if otool -l output/GlossyGlass.dylib | grep -q "platform 1"; then
            echo "✅ SUCCESS: Real iOS binary (platform 1)"
          else
            echo "Platform check (no platform 2 is good):"
            otool -l output/GlossyGlass.dylib | grep -A10 LC_BUILD_VERSION || true
          fi

          ls -la output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GlossyGlass-dylib
          path: output/GlossyGlass.dylib
          retention-days: 30
