name: Build iOS dylib

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS arm64 dylib (direct swiftc)
        run: |
          set -e

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          TARGET="arm64-apple-ios17.0"
          echo "SDK    = $SDK"
          echo "Target = $TARGET"
          echo "Xcode  = $(xcodebuild -version | head -1)"

          mkdir -p output build

          # Collect all Swift sources
          SOURCES=$(find . -name "*.swift" -not -path "./.build/*" -not -path "./output/*" | tr '\n' ' ')
          echo "Sources: $SOURCES"

          # Compile to a single iOS dylib using swiftc directly
          # This bypasses SPM's host-platform default
          xcrun --sdk iphoneos swiftc \
            -emit-library \
            -o output/GlossyGlass.dylib \
            -module-name GlossyGlass \
            -target "$TARGET" \
            -sdk "$SDK" \
            -O \
            -whole-module-optimization \
            -parse-as-library \
            -enable-library-evolution \
            -Xlinker -ios_version_min -Xlinker 17.0 \
            $SOURCES

          echo "=== file info ==="
          file output/GlossyGlass.dylib

          echo "=== LC_BUILD_VERSION ==="
          otool -l output/GlossyGlass.dylib | grep -A6 LC_BUILD_VERSION || true

          # Final platform check
          if otool -l output/GlossyGlass.dylib | grep -q "platform 2"; then
            echo "ERROR: Still macOS binary (platform 2)"
            exit 1
          fi

          if otool -l output/GlossyGlass.dylib | grep -q "platform 1"; then
            echo "SUCCESS: Confirmed iOS binary (platform 1)"
          else
            echo "WARNING: Could not confirm platform 1, but not platform 2 either"
            otool -l output/GlossyGlass.dylib | grep -A8 LC_BUILD_VERSION || true
          fi

          ls -la output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GlossyGlass-dylib
          path: output/GlossyGlass.dylib
          retention-days: 30
