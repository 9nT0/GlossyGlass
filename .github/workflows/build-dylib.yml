PBX

          # -------------------------------------------------------
          # 2. Build with xcodebuild for real iOS device
          # -------------------------------------------------------
          echo "Building with xcodebuild..."
          xcodebuild \
            -project GlossyGlass.xcodeproj \
            -target GlossyGlass \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          # -------------------------------------------------------
          # 3. Locate and verify the dylib
          # -------------------------------------------------------
          DYLIB=$(find build -name "GlossyGlass.dylib" | head -1)
          if [ -z "$DYLIB" ]; then
            echo "ERROR: dylib not found"
            find build -type f | head -40
            exit 1
          fi

          mkdir -p output
          cp "$DYLIB" output/GlossyGlass.dylib

          echo ""
          echo "=== file ==="
          file output/GlossyGlass.dylib

          echo ""
          echo "=== LC_BUILD_VERSION ==="
          otool -l output/GlossyGlass.dylib | grep -A8 LC_BUILD_VERSION || true

          if otool -l output/GlossyGlass.dylib | grep -q "platform 2"; then
            echo "ERROR: Still macOS (platform 2)"
            exit 1
          fi

          if otool -l output/GlossyGlass.dylib | grep -q "platform 1"; then
            echo "✅ SUCCESS: Real iOS binary (platform 1)"
          else
            echo "Platform info:"
            otool -l output/GlossyGlass.dylib | grep -A10 LC_BUILD_VERSION || true
          fi

          ls -la output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GlossyGlass-dylib
          path: output/GlossyGlass.dylib
          retention-days: 30
