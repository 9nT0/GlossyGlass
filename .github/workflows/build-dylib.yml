name: Build iOS dylib

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Build GlossyGlass.dylib
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version || true
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          SWIFT=$(xcrun -f swiftc)
          TARGET="arm64-apple-ios16.0"
          OUT="GlossyGlass.dylib"

          mapfile -t SWIFT_FILES < <(find Loader Core UI Instagram Public -name "*.swift" 2>/dev/null | sort)
          mapfile -t OBJC_FILES < <(find Loader -name "*.m" 2>/dev/null | sort)

          echo "Swift (${#SWIFT_FILES[@]}):"
          printf '  %s\n' "${SWIFT_FILES[@]}"
          echo "ObjC (${#OBJC_FILES[@]}):"
          printf '  %s\n' "${OBJC_FILES[@]}"

          [ ${#SWIFT_FILES[@]} -gt 0 ] || { echo "No Swift sources"; find . -type f | head -40; exit 1; }

          SWIFT_LIB="/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"
          [ -d "$SWIFT_LIB" ] || SWIFT_LIB=$(dirname $(xcrun -f swift))/../lib/swift/iphoneos

          mkdir -p build

          $SWIFT -sdk "$SDK" -target "$TARGET" -module-name GlossyGlass -parse-as-library -O -c \
            "${SWIFT_FILES[@]}" -o build/GlassSwift.o

          if [ ${#OBJC_FILES[@]} -gt 0 ]; then
            xcrun -sdk iphoneos clang -c -target "$TARGET" -isysroot "$SDK" -fobjc-arc -O2 \
              "${OBJC_FILES[@]}" -o build/GlassObjC.o
          fi

          OBJS=(build/GlassSwift.o)
          [ -f build/GlassObjC.o ] && OBJS+=(build/GlassObjC.o)

          xcrun -sdk iphoneos clang -target "$TARGET" -isysroot "$SDK" -dynamiclib -o "$OUT" \
            "${OBJS[@]}" \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore \
            -lswiftCore -lswiftFoundation -lswiftUIKit \
            -L"$SWIFT_LIB" -rpath /usr/lib/swift \
            -install_name "@rpath/GlossyGlass.dylib" || \
          xcrun -sdk iphoneos clang -target "$TARGET" -isysroot "$SDK" -dynamiclib -o "$OUT" \
            "${OBJS[@]}" \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore \
            -L"$SWIFT_LIB" -install_name "@rpath/GlossyGlass.dylib"

          ls -la "$OUT"
          file "$OUT"
          lipo -info "$OUT" || true

      - uses: actions/upload-artifact@v4
        with:
          name: GlossyGlass-dylib
          path: GlossyGlass.dylib
          if-no-files-found: error
