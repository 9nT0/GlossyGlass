name: Build iOS dylib

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for iPhoneOS arm64
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"

          # Force pure iOS build
          swift build -c release \
            --arch arm64 \
            -Xswiftc -sdk -Xswiftc "$SDK" \
            -Xswiftc -target -Xswiftc arm64-apple-ios17.0 \
            -Xcc -isysroot -Xcc "$SDK" \
            -Xcxx -isysroot -Xcxx "$SDK"

      - name: Package the dylib
        run: |
          mkdir -p output
          BINARY=$(find .build -type f \( -name "libGlossyGlass.dylib" -o -name "GlossyGlass" \) | head -1)

          if [ -z "$BINARY" ]; then
            echo "=== DEBUG: files in .build ==="
            find .build -type f | head -50
            exit 1
          fi

          echo "Found binary: $BINARY"
          cp "$BINARY" output/GlossyGlass.dylib
          file output/GlossyGlass.dylib
          ls -la output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlossyGlass-dylib
          path: output/GlossyGlass.dylib
          retention-days: 30
