<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a12"/>
      <stop offset="50%" style="stop-color:#12121f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18"/>
      <stop offset="50%" style="stop-color:#a8c0ff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="180" fill="#4a6cf7" opacity="0.25" filter="url(#blur)"/>
  <circle cx="1000" cy="480" r="220" fill="#7b5cff" opacity="0.2" filter="url(#blur)"/>
  <circle cx="600" cy="300" r="160" fill="#00d4ff" opacity="0.12" filter="url(#blur)"/>
  <!-- Glass pill -->
  <rect x="340" y="240" width="520" height="90" rx="45" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="600" y="298" font-family="SF Pro Display, -apple-system, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle">GlossyGlass</text>
  <text x="600" y="380" font-family="SF Pro Display, -apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.55" text-anchor="middle">Liquid Glass Engine · iOS 26 Feel · v5</text>
</svg>